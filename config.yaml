router: perf_router

# ── Provider routing (shared across all strategies) ──────────────────────────
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 120.0
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 120.0
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    timeout_s: 90.0
  anthropic:
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 180.0
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_s: 120.0
  moonshot:
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    timeout_s: 120.0

# Per-model overrides (take precedence over perfrouter data and provider defaults)
model_overrides:
  deepseek/deepseek-v4-flash:
    thinking_mode: false   # model supports CoT but we don't activate it by default
  deepseek/deepseek-v4-pro:
    timeout_s: 240.0
    thinking_default: true
  anthropic/claude-sonnet-4.6:
    thinking_default: true

# ── PerfRouter policy ─────────────────────────────────────────────────────────
perf_router:
  model_set: curated           # curated | full
  perfrouter_data_dir: ../perfrouter/data
  perfrouter_models_yaml: ../perfrouter/models.yaml
  checkpoint: auto             # auto = look in {data_dir}/../models/perf_router.pkl, then {data_dir}/
  cost_weight: 0.3
  degradation_threshold: 0.15
  min_similarity: 0.20
  baseline: deepseek/deepseek-v4-flash
  cost_cap_multiplier: 2.0     # null to disable cap entirely
  # Laya difficulty tier: per-request δ and cost cap. Missing block = off.
  # Tier numbers and min_confidence are placeholders — tune from shadow data.
  laya:
    mode: shadow                 # off | shadow | active
    backend: embedded            # embedded | remote (remote = phase 2, not implemented yet)
    embedded:                    # laya runs inside the optmod process
      checkpoint: convaiinnovations/laya   # hub id or local path
      device: null               # null = let laya choose; or cuda, cuda:0, cpu
    remote:                      # laya-serve over HTTP (phase 2)
      base_url: http://127.0.0.1:8000      # localhost or any other URL
      api_key_env: LAYA_API_KEY            # optional bearer token, read from env
      model: english             # laya-serve model name: english | multilingual | typed-decisions
    timeout_ms: 80
    max_chars: 1500
    min_confidence: 0.5
    breaker_failures: 3
    breaker_cooldown_s: 60
    tiers:                       # δ must stay > 0 (δ = 0 means argmax utility, not best quality)
      easy:   { delta: 0.25, cost_cap: 2.0 }
      medium: { delta: 0.15, cost_cap: 2.0 }
      hard:   { delta: 0.03, cost_cap: 4.0 }

# ── TRouter policy ────────────────────────────────────────────────────────────
trouter:
  checkpoint: routing/trouter_weights.pt

# ── Shared ────────────────────────────────────────────────────────────────────
session_pin:
  hard_window_s: 300
  soft_window_s: 1800
  soft_bonus_weight: 0.5

tool_result_compressor: false
primary_model: deepseek/deepseek-v4-flash
policy_path: routing_policy.pkl
log_path: routing.log.jsonl
escalation:
  max_escalations: 2

# ── Active model set (when model_set: curated) ───────────────────────────────
# IDs must match perfrouter/models.yaml `id` field exactly.
curated_models:
  - nvidia/nemotron-3-super-120b-a12b:free
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-v4-pro
  - google/gemini-3.1-flash-lite
  - tencent/hy3-preview
  - anthropic/claude-sonnet-4.6
  - xiaomi/mimo-v2.5-pro
  - moonshotai/kimi-k2.6
  - openai/gpt-4o-mini
  - openai/gpt-oss-120b:free
