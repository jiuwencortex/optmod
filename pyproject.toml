[project]
name = "optmod"
version = "0.1.0"
requires-python = ">= 3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx[test]",
]
trouter = [
    "torch>=2.0",
    "sentence-transformers>=3.0",
]
perfrouter = [
    "perfrouter",
]
laya = [
    "laya>=0.3.26",
]

[tool.uv.sources]
# Install the sibling perfrouter package directly from disk.
# Run: uv pip install -e '.[perfrouter]'
# uv resolves "perfrouter" to the local path below instead of PyPI.
perfrouter = { path = "../perfrouter", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Flat layout: the project root IS the optmod package.
# package-dir maps the package name to "." so that
# `from optmod.main import app` resolves to ./main.py, etc.
[tool.setuptools]
packages = ["optmod", "optmod.routing", "optmod.routing.trouter", "optmod.mutators"]

[tool.setuptools.package-dir]
optmod = "."
"optmod.routing" = "routing"
"optmod.mutators" = "mutators"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
